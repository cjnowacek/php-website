name: Deploy to SiteGround
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.SG_HOST }}" ] || [ -z "${{ secrets.SG_USER }}" ] || [ -z "${{ secrets.SG_SSH_KEY }}" ]; then
            echo "::error::Missing SG_HOST / SG_USER / SG_SSH_KEY repo secrets. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Astro site
        run: |
          npm ci
          npm run build

      # Host keys are pinned rather than ssh-keyscan'd at deploy time: SiteGround's
      # brute-force protection intermittently drops connections from cloud-runner
      # IPs, and a failed scan used to kill the whole deploy (the rsync below gets
      # retries for the same reason). Pinned keys are public info and safe in git.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/known_hosts <<'EOF'
          [ssh.cjnowacek.com]:18765 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMAJVNdbTG4hQMroKVu4UQPiLybooAMlSS/B/asy7gv
          [ssh.cjnowacek.com]:18765 ssh-rsa 
          EOF
          # Best-effort scan in case SG_HOST isn't ssh.cjnowacek.com (pinned above)
          ssh-keyscan -p "${{ secrets.SG_PORT || '18765' }}" "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts || true

      # dist/ is the whole site. Protected on the server:
      #   /play/            - deployed separately by deploy-play.sh
      #   /includes/contact_submissions.json - live contact-form log
      #   /.well-known/     - host-managed (Let's Encrypt)
      #   /static/img/**    - images live on the server, not in git, EXCEPT the
      #                       tracked hover videos + ml3ds card art, which deploy
      - name: Deploy site (built output; images stay on the server)
        run: |
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && { echo "rsync attempt $attempt after 30s..."; sleep 30; }
            rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SG_PORT || '18765' }}" \
            --exclude='/play/' \
            --exclude='/includes/contact_submissions.json' \
            --exclude='/.well-known/' \
            --include='/static/img/' \
            --include='/static/img/project-cards/' \
            --include='/static/img/project-cards/video/***' \
            --include='/static/img/project-cards/ml3ds-webp-1200x900.webp' \
            --exclude='/static/img/**' \
            dist/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:www/cjnowacek.com/public_html/" \
              && exit 0
          done
          echo "::error::rsync failed after 3 attempts"
          exit 1
